
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Clínica Odontológica</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body class="pagina-autenticacion">

    <header class="encabezado-auth">
        <h1>Clínica Odontológica</h1>

        <nav>
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('registro') }}">Crear cuenta</a>
        </nav>
    </header>

    <main class="contenedor-auth">
        <section class="tarjeta-auth">
            <h2>Bienvenido de nuevo</h2>
            <p class="texto-auth">
                Ingresa a tu cuenta para continuar.
            </p>

            {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensaje in mensajes %}
                    <div class="mensaje-auth {{ categoria }}">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit" class="boton-principal boton-formulario">
                    Iniciar sesión
                </button>
            </form>

            <p class="texto-enlace-auth">
                ¿No tienes una cuenta?
                <a href="{{ url_for('registro') }}">Regístrate aquí</a>
            </p>
        </section>
    </main>

</body>
</html>
