
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar cita</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <main>
        <h1>Solicitar cita</h1>

        <p><strong>Doctor:</strong> {{ doctor.nombre }} {{ doctor.apellido }}</p>
        <p><strong>Fecha:</strong> {{ fecha }}</p>
        <p><strong>Hora:</strong> {{ hora_inicio }} - {{ hora_fin }}</p>

        <form method="POST"
              action="{{ url_for('formulario_cita', id_doctor=doctor.id_doctor, fecha=fecha, hora_inicio=hora_inicio, hora_fin=hora_fin) }}">

            <input type="hidden" name="fecha" value="{{ fecha }}">
            <input type="hidden" name="hora_inicio" value="{{ hora_inicio }}">
            <input type="hidden" name="hora_fin" value="{{ hora_fin }}">

            <label for="motivo">Motivo de la cita:</label>
            <textarea id="motivo" name="motivo"
                      rows="4" required
                      placeholder="Explica brevemente el motivo de tu consulta"></textarea>

            <button type="submit">Enviar solicitud</button>
        </form>

        <p>
            <a href="{{ url_for('ver_horarios_cita', id_doctor=doctor.id_doctor, fecha=fecha) }}">
                Volver a los horarios
            </a>
        </p>
    </main>
</body>
</html>
